# Ships the model to nando-web (step 7 of nando-kanji-ml#1, ADR 0005).
#
# Pushing a tag vN on a commit in main opens a PR in feriosch/nando-web that
# replaces public/models/kanji/ with release/ (the model, its labels,
# release.json), fixtures/drawings.json and a version.json holding the tag.
# Only that folder changes: older models live in nando-web's git history.
#
# On this repo's PRs that touch the release, it does everything except push and
# open the PR (a dry run that needs no token), so a release isn't the first time
# these steps run.
#
# Needs the secret NANDO_WEB_TOKEN: a fine-grained token limited to
# feriosch/nando-web, with Contents and Pull requests set to read and write.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["release/**", "fixtures/drawings.json", "bench/variants.js", ".github/workflows/release.yml"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  nando-web:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
      VERSION: ${{ github.event_name == 'push' && github.ref_name || 'dry-run' }}
      BRANCH: kanji-model/${{ github.event_name == 'push' && github.ref_name || 'dry-run' }}
      SOURCE: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.event_name == 'push' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the whole history, to check the tagged commit is in main

      - name: Check the tagged commit is in main
        if: env.PUBLISH == 'true'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$VERSION isn't on main: merge the release first, then tag a commit in main"; exit 1; }

      - name: Check the release files
        run: |
          python3 - <<'EOF'
          import json, pathlib
          release = json.loads(pathlib.Path("release/release.json").read_text(encoding="utf-8"))
          labels = json.loads(pathlib.Path("release/labels.json").read_text(encoding="utf-8"))
          fixtures = json.loads(pathlib.Path("fixtures/drawings.json").read_text(encoding="utf-8"))
          assert pathlib.Path("release/kanji.tflite").stat().st_size > 0, "release/kanji.tflite is empty"
          assert len(labels) == release["classes"] == len(set(labels)), "labels.json doesn't match release.json"
          assert {"top1", "top8", "runtime"} <= release.keys(), "release.json needs top1, top8 and runtime"
          assert fixtures, "fixtures/drawings.json is empty"
          print(f"{len(labels)} kanji, {len(fixtures)} fixture Drawings, runtime {release['runtime']}")
          EOF

      - name: Check the token
        if: env.PUBLISH == 'true'
        env:
          TOKEN: ${{ secrets.NANDO_WEB_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::Add the NANDO_WEB_TOKEN secret (see the top of release.yml)"; exit 1; }

      - uses: actions/checkout@v4
        with:
          repository: feriosch/nando-web
          path: web
          # nando-web is public, so a dry run reads it with this repo's own token
          token: ${{ env.PUBLISH == 'true' && secrets.NANDO_WEB_TOKEN || github.token }}

      - name: Replace public/models/kanji
        id: replace
        run: |
          folder=web/public/models/kanji
          rm -rf "$folder"
          mkdir -p "$folder"
          cp release/kanji.tflite release/labels.json release/release.json fixtures/drawings.json "$folder/"
          printf '{\n  "version": "%s"\n}\n' "$VERSION" > "$folder/version.json"
          git -C web add --all public/models/kanji
          git -C web status --short
          if git -C web diff --cached --quiet; then
            echo "nando-web's main already has exactly these files: nothing to release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare the nando-web commit and PR text
        if: steps.replace.outputs.changed == 'true'
        run: |
          cd web
          git switch --create "$BRANCH"
          git -c user.name="nando-kanji-ml release" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Update the kanji model to $VERSION" -m "From $SOURCE"
          git show --stat --format="%h %s" HEAD
          python3 - <<'EOF' > "$RUNNER_TEMP/pr-body.md"
          import json, os
          release = json.load(open("public/models/kanji/release.json", encoding="utf-8"))
          version, source = os.environ["VERSION"], os.environ["SOURCE"]
          print(f"""Kanji model **{version}** from [feriosch/nando-kanji-ml {version}]({source}), \
          on the ETL9G test set: top-1 {release['top1']:.2%}, top-8 {release['top8']:.2%}.

          Replaces `public/models/kanji/`:
          - `kanji.tflite`: the float16 model, for {release['runtime']} on {release['accelerator']}
          - `labels.json`: output i is the kanji `labels[i]`
          - `release.json`: the runtime and input shape it was chosen and checked with
          - `drawings.json`: the preprocessing fixtures; the TypeScript preprocessing must match each within 1 per pixel
          - `version.json`: `{version}`

          Opened by nando-kanji-ml's release workflow.""")
          EOF
          cat "$RUNNER_TEMP/pr-body.md"

      - name: Push and open the nando-web PR
        if: env.PUBLISH == 'true' && steps.replace.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.NANDO_WEB_TOKEN }}
        run: |
          cd web
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::nando-web already has a $BRANCH branch. To release $VERSION again, close its PR and delete the branch, then re-run."
            exit 1
          fi
          git push --quiet origin "$BRANCH"
          gh pr create --repo feriosch/nando-web --base main --head "$BRANCH" \
            --title "Kanji model $VERSION" --body-file "$RUNNER_TEMP/pr-body.md"
